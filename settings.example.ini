# Copy to settings.ini and change what you need. Environment variables in parentheses override a key.
# A settings.ini in the save folder is read instead of the one next to the game; the in-game pages
# save there.
# Window: windowed, borderless (covers the screen at the desktop resolution) or fullscreen
# (STARDUST_DISPLAY_MODE).
display_mode=borderless
# Windowed resolution, WIDTHxHEIGHT: the window's size, 16:9 (the only shape the game draws; another
# shape moves to the 16:9 size nearest in height) (STARDUST_OUTPUT_RESOLUTION). The fullscreen modes
# pick their own: borderless the desktop, fullscreen the largest 16:9 screen mode (else the desktop's),
# with black bars when the screen is of another shape. The game's picture is filtered to it.
output_resolution=1920x1080
# Display index the window opens on, empty for the primary (STARDUST_MONITOR).
monitor=
# VSync (STARDUST_VSYNC): 1 waits for the monitor; 0 shows the newest frame at each refresh,
# still without tearing (some drivers hold that to twice the refresh rate).
vsync=1
# With vsync=0: 1 shows each frame at once, tearing allowed: the least input delay and no frame rate
# ceiling (STARDUST_TEARING). README "Advanced settings".
tearing=0
# The game's frame rate: 30, 60 (the PS4's), 90, 120, 144 or 180, at normal game speed: the engine's own
# frame rate and the PS4 vblank both follow it (STARDUST_FRAME_RATE). It is held to what the display
# refreshes at (180 on a 120 Hz display runs at 120) unless VSync is off with tearing allowed. 90 on
# a 120 Hz display is smooth with VRR (FreeSync, G-Sync); without it frames show unevenly.
# The engine runs one fixed step per frame, so the PC must hold the rate: a slower frame slows the
# game down, and 30 is there for PCs that cannot hold 60. Also in the Display
# Settings panel (F10, or hold Select or Start for 1 second), which applies it at once and saves it here
# with the other display keys.
frame_rate=60
# Render resolution: the size the game itself draws at, HUD and menus included, 16:9
# (STARDUST_RENDER_RESOLUTION; next start): 720p, 1080p (the PS4's), 1440p or 4k. It is filtered to
# the output resolution.
render_resolution=1080p
# Sharpening (STARDUST_SHARPENING): 1 (default) runs AMD FSR 1 RCAS over the picture at the window's
# size, for crisper edges without halos; 0 shows it as filtered. Also in the Display Settings panel,
# where it applies at once, and on F9, which switches it over the game to compare.
sharpening=1
# Speakers: auto, stereo, 5.1, 7.1 (STARDUST_AUDIO_CHANNELS).
audio_channels=auto
# Controller speaker sounds (STARDUST_PAD_SPEAKER): controller (default) plays them on a DualShock 4's
# or DualSense's own speaker when it is plugged in by USB (else on the main output), main always on
# the main output, off not at all.
pad_speaker=controller
# 1 (default): skip the start-up logos and notices; 0 shows them. The setup's checkbox sets it
# (STARDUST_SKIP_INTRO).
skip_intro=1
# Cheats ticked on the Cheats page (L3+R3), as a sum: 1 invulnerability, 2 infinite lives,
# 4 infinite bombs, 8 max weapon upgrades, 16 instant boost recharge. 0: none.
cheats=0
